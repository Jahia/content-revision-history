# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This repository has three distinct dependency surfaces:
#   - Maven at the root (the OSGi module itself)
#   - Yarn at /tests (the @jahia/cypress e2e harness; Dependabot handles Yarn under "npm")
#   - a Dockerfile at /tests (the Cypress base image)
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Test-only dependencies are low risk; review them together rather than one PR each.
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.jacoco*"
    ignore:
      # The Jahia platform artifacts are PROVIDED and must match the target Jahia version.
      # Bumping them independently produces a module that compiles but fails at runtime, so
      # these belong to a deliberate platform upgrade, never to an automated PR.
      - dependency-name: "org.jahia.modules:jahia-modules"
      - dependency-name: "org.jahia.server:*"
      # NOTE: jsoup is deliberately NOT ignored. It is EMBEDDED in the bundle rather than
      # imported, so our copy is private to this module and can be patched independently of the
      # version the platform ships. Suppressing it would have hidden the advisory that took it
      # to 1.23.1.

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Cypress and its plugins move together; a split bump usually fails to resolve.
      cypress:
        patterns:
          - "cypress"
          - "cypress-*"
          - "@cypress/*"
      linting:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier"
    ignore:
      # The harness resolves @jahia/cypress at run time from this range and the shipped
      # ci.*/env.run scripts are versioned with it; upgrading is a harness migration, not a
      # dependency bump.
      - dependency-name: "@jahia/cypress"

  - package-ecosystem: "docker"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

# Note: no "github-actions" entry. This repository ships no workflows of its own -- CodeQL and
# the CLA check come from org-level configuration -- so there is nothing here for Dependabot to
# update. Add that ecosystem if and when .github/workflows/ gains a workflow.
