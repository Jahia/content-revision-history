# Node type + property labels shown in Content Editor
jmix_publiclyRevisioned=Public revision history
crh_revisionHistory=Revision history
crh_revisionHistory.historyTitle=Heading shown above the revision list
crh_revisionHistory.historyTitle.description=Optional. Text displayed as the section heading above the revision list on the live page. Leave blank to use the default label "Revision history".
crh_revisionHistory.collapsedByDefault=Start with the revision list collapsed
crh_revisionHistory.collapsedByDefault.description=When ticked, visitors see a single line they can expand. The revisions stay on the page either way, because collapsing hides them from view but not from search engines or screen readers.
crh_revisionHistory.toggle={0} recorded revision(s)
crh_revisionEntry=Revision
crh_revisionEntry.revisionLabel=Version label
crh_revisionEntry.revisionDate=Revision date
crh_revisionEntry.revisionDate.description=The date this revision was published and made visible to visitors, not the date it was drafted or last edited.
crh_revisionEntry.summary=What changed
crh_revisionEntry.changeType=Change type
crh_revisionEntry.changeType.description=Editorial: wording or formatting only, meaning is unchanged. Substantive: the meaning or guidance changed. Correction: fixes an error present in a previous revision.
crh_revisionEntry.changeType.editorial=Editorial (wording, formatting)
crh_revisionEntry.changeType.substantive=Substantive (meaning changed)
crh_revisionEntry.changeType.correction=Correction
crh_revisionSnapshot=Revision snapshot (system)

# Public-facing strings rendered on the live page (crh_revisionHistory / crh_revisionEntry views)
crh_revisionHistory.defaultTitle=Revision history

# ---------------------------------------------------------------- comparison panel
# Parameterised entries are MessageFormat patterns: any literal apostrophe in them would have
# to be doubled, so they are written without apostrophes instead.
crh_diff.heading=Comparing {0} ({1}) with {2} ({3})
crh_diff.headingUnavailable=Comparison unavailable
crh_diff.fullscreen=Full screen
crh_diff.close=Close the comparison
crh_diff.stats={0} line(s) added, {1} line(s) removed
crh_diff.identical=These two revisions have identical page content. The revision was recorded, but nothing in the text of the page changed between them.
crh_diff.gap={0} unchanged line(s) not shown
# Announced to assistive technology in place of the +/- markers, which are aria-hidden.
crh_diff.added=Added line:
crh_diff.removed=Removed line:
crh_diff.generatorMismatch=These two snapshots were produced by different versions of the snapshot generator, so some differences shown below may be changes in formatting rather than changes to the content of the page.
crh_diff.truncated=This page is too long to compare in full. Only the beginning of each revision is shown.
crh_compare.legend=Compare two revisions
crh_compare.from=Compare
crh_compare.to=with
crh_compare.submit=Compare
crh_diff.unavailable.notFound=One of the selected revisions is not part of this history.
crh_diff.unavailable.sameRevision=Those are the same revision. Choose two different ones to compare.
crh_diff.unavailable.noSnapshot=No snapshot of the page was recorded for this revision, so it cannot be compared. Snapshots are captured when the page is published.
crh_diff.unavailable.noPreviousSnapshot=No snapshot of the page was recorded for the previous revision, so there is nothing to compare this one with.

# ---------------------------------------------------------------- snapshot preview (jContent)
crh_snapshotPreview.heading=Captured snapshot
crh_snapshotPreview.capturedAt=Captured
crh_snapshotPreview.language=Language
crh_snapshotPreview.capturedBy=Captured as
crh_snapshotPreview.generatorVersion=Generator version
crh_snapshotPreview.contentHash=Content hash
crh_snapshotPreview.sourceUrl=Source URL
crh_snapshotPreview.content=Page content as captured
crh_snapshotPreview.empty=This snapshot has no stored content.
