# Node type + property labels shown in Content Editor
jmix_publiclyRevisioned=Public revision history
crh_revisionHistory=Revision history
crh_revisionHistory.historyTitle=Heading shown above the revision list
crh_revisionHistory.historyTitle.description=Optional. Text displayed as the section heading above the revision list on the live page. Leave blank to use the default label "Revision history".
crh_revisionHistory.collapsedByDefault=Start with the revision list collapsed
crh_revisionHistory.collapsedByDefault.description=When ticked, visitors see a single line they can expand. The revisions stay on the page either way, because collapsing hides them from view but not from search engines or screen readers.
crh_revisionHistory.toggle={0} recorded revision(s)
crh_revisionEntry=Revision
crh_revisionEntry.revisionLabel=Version label
crh_revisionEntry.revisionDate=Revision date
crh_revisionEntry.revisionDate.description=The date this revision was published and made visible to visitors, not the date it was drafted or last edited.
crh_revisionEntry.summary=What changed
crh_revisionEntry.crh_pinnedSnapshot=Snapshot this revision describes
crh_revisionEntry.crh_pinnedSnapshot.description=Leave empty and this revision is attached to whatever snapshot is current when you publish it, which is what you want when you are describing the change you just made. Choose one when you are describing an older revision \u2014 after backfilling history, for example \u2014 because otherwise every entry attaches to the newest snapshot and comparing two of them reports that nothing changed. Options are listed newest first, each showing when it was captured and how the page started. Set per language: a snapshot belongs to one language, so pinning in English says nothing about French.
crh_revisionEntry.crh_snapshotRef=Snapshot this revision describes (previous field)
crh_revisionEntry.crh_snapshotRef.description=Superseded by the field above, which is set per language. Kept so revisions pinned before the change keep working; leave it alone unless you are looking at one of those. Leave empty and this revision is attached to whatever snapshot is current when you publish it, which is what you want when you are describing the change you just made. Choose one when you are describing an older revision \u2014 after backfilling history, for example \u2014 because otherwise every entry attaches to the newest snapshot and comparing two of them reports that nothing changed. Options are listed newest first, each showing when it was captured and how the page started.
crh_revisionEntry.changeType=Change type
crh_revisionEntry.changeType.description=Editorial: wording or formatting only, meaning is unchanged. Substantive: the meaning or guidance changed. Correction: fixes an error present in a previous revision.
crh_revisionEntry.changeType.editorial=Editorial (wording, formatting)
crh_revisionEntry.changeType.substantive=Substantive (meaning changed)
crh_revisionEntry.changeType.correction=Correction
crh_revisionSnapshot=Revision snapshot (system)

# Public-facing strings rendered on the live page (crh_revisionHistory / crh_revisionEntry views)
crh_revisionHistory.defaultTitle=Revision history

# ---------------------------------------------------------------- comparison panel
# Parameterised entries are MessageFormat patterns: any literal apostrophe in them would have
# to be doubled, so they are written without apostrophes instead.
crh_diff.heading=Comparing {0} ({1}) with {2} ({3})
crh_diff.headingUnavailable=Comparison unavailable
crh_diff.fullscreen=Full screen
crh_diff.close=Close the comparison
crh_diff.stats={0} line(s) added, {1} line(s) removed
crh_diff.identical=These two revisions have identical page content. The revision was recorded, but nothing in the text of the page changed between them.
crh_diff.gap={0} unchanged line(s) not shown
# Announced to assistive technology in place of the +/- markers, which are aria-hidden.
crh_diff.added=Added line:
crh_diff.removed=Removed line:
crh_diff.olderSide = Older revision:
crh_diff.newerSide = Newer revision:
crh_diff.generatorMismatch=These two snapshots were produced by different versions of the snapshot generator, so some differences shown below may be changes in formatting rather than changes to the content of the page.
crh_diff.truncated=This page is too long to compare in full. Only the beginning of each revision is shown.
crh_diff.sourceTruncated=A snapshot in this comparison is larger than this module can read, so the comparison was made from only the beginning of it. Lines after that point may be shown as removed when nothing was removed. Treat this comparison as incomplete rather than as the record of what changed.
crh_snapshotPreview.truncated=This snapshot is larger than this module can read. Only the beginning is shown below, so what follows is missing rather than absent from the page.
crh_compare.legend=Compare two revisions
crh_compare.loading = Loading the comparison
crh_compare.from=Compare
crh_compare.to=with
crh_compare.submit=Compare
crh_diff.unavailable.notFound=One of the selected revisions is not part of this history.
crh_diff.unavailable.sameRevision=Those are the same revision. Choose two different ones to compare.
crh_diff.unavailable.noSnapshot=No snapshot of the page was recorded for this revision, so it cannot be compared. Snapshots are captured when the page is published.
crh_diff.unavailable.noPreviousSnapshot=No snapshot of the page was recorded for the previous revision, so there is nothing to compare this one with.

# ---------------------------------------------------------------- snapshot preview (jContent)
crh_snapshotPreview.heading=Captured snapshot
crh_snapshotPreview.capturedAt=Captured
crh_snapshotPreview.language=Language
crh_snapshotPreview.capturedBy=Captured as
crh_snapshotPreview.generatorVersion=Generator version
crh_snapshotPreview.contentHash=Content hash
crh_snapshotPreview.sourceUrl=Source URL
crh_snapshotPreview.content=Page content as captured
crh_snapshotPreview.empty=This snapshot has no stored content.

# ---------------------------------------------------------------- system types
# crh:snapshotFolder and crh:revisionSnapshot carry jmix:hiddenType, so an editor never creates
# one, but both are still reachable in jContent and their fields were showing as raw keys
# (crh_snapshotDate and so on). Everything below is written and maintained by the module: an
# editor reads these, never sets them.
#
# Namespaced properties keep their prefix in the key, with ':' replaced by '_'
# (crh_revisionSnapshot.crh_snapshotDate), which is the same convention the platform's own
# modules use for j:-prefixed properties.

crh_snapshotFolder=Revision snapshots for one page and language (system)
crh_snapshotFolder.crh_latestHash=Hash of the most recent snapshot
crh_snapshotFolder.crh_latestHash.description=Fingerprint of the last captured page text. A new publication whose text hashes to the same value stores no new snapshot.
crh_snapshotFolder.crh_latestSnapshot=Most recent snapshot
crh_snapshotFolder.crh_snapshotCount=Snapshots kept
crh_snapshotFolder.crh_prunedCount=Snapshots pruned
crh_snapshotFolder.crh_prunedCount.description=How many of the oldest snapshots have been removed to stay within the per-page retention cap. A revision bound to a pruned snapshot can no longer be compared.
crh_snapshotFolder.crh_lastCaptureStatus=Last capture outcome
crh_snapshotFolder.crh_lastCaptureStatus.description=Why the last publication did or did not produce a snapshot. STORED and UNCHANGED are normal; anything else means no snapshot was recorded and the message explains what to fix.
crh_snapshotFolder.crh_lastCaptureMessage=Last capture message
crh_snapshotFolder.crh_lastCaptureDate=Last capture attempt

crh_revisionSnapshot.crh_snapshotDate=Captured
crh_revisionSnapshot.crh_snapshotDate.description=The moment the page text below was captured, which is the publication that produced it rather than the moment this node was written.
crh_revisionSnapshot.crh_language=Language
crh_revisionSnapshot.crh_contentHash=Content hash
crh_revisionSnapshot.crh_generatorVersion=Generator version
crh_revisionSnapshot.crh_generatorVersion.description=Version of the Markdown generator that produced this text. Two snapshots made by different versions may differ in formatting rather than in content, and a comparison between them says so.
crh_revisionSnapshot.crh_capturedBy=Captured as
crh_revisionSnapshot.crh_capturedBy.description=The account the page was rendered as. This is whose view of the page the text represents, and therefore who may safely be shown it: guest means anyone could have read it, any other name means the snapshot may contain content the public cannot see.
crh_revisionSnapshot.crh_sourceUrl=Source URL
crh_revisionSnapshot.crh_markdown=Page content as captured
crh_revisionSnapshot.crh_entryRefs=Revisions using this snapshot
crh_revisionSnapshot.crh_entryRefs.description=The revision entries whose content this snapshot is the evidence for. Set when a revision is bound, and moved if an editor later re-points that revision at a different snapshot.
