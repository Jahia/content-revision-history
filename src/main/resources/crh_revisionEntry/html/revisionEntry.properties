# This view varies on the requested comparison (aria-current on the active Compare link),
# and Jahia keys HTML cache entries on node + template type + user + locale, never on the query
# string. A cached entry fragment would therefore carry whichever comparison happened to be
# rendered first. The parent revisionHistory view is uncached for the same reason, so caching a
# child fragment inside it buys almost nothing anyway.
cache.expiration=0
