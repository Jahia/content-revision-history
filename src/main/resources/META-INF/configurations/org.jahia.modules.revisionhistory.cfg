# default configuration - won't be overridden
#
# Content Revision History.
#
# Everything here is optional. With the file as shipped, capture renders anonymously, which is
# the right behaviour for a site whose revisioned pages are public.
#
# ---------------------------------------------------------------------------------------------
# Capture principal
# ---------------------------------------------------------------------------------------------
#
# Set capture.user to give RESTRICTED pages a revision history. An anonymous render of a page
# guest may not read returns 403, so without a principal such a page is never captured at all.
#
# What this account can read is what the snapshots will contain, permanently, for everyone who
# is later allowed to view the history. Give it the narrowest access that covers the pages being
# revisioned, and nothing else.
#
# Two consequences worth knowing before setting it:
#
#   1. The comparison checks the VIEWER's own JCR rights on the revision history before serving
#      anything, so a snapshot is not handed to someone who cannot read the page it came from.
#
#   2. Component-level ACLs INSIDE a revisioned page are not reflected per viewer. A snapshot is
#      one artifact with one visibility, flattened to text by one principal, so it cannot answer
#      "what may this particular reader see" the way a live render can. Placing a revision
#      history on a page whose components have different audiences is an administrative
#      decision, not something the module can resolve.
#
# capture.user =

# The secret for capture.user, as a path to a file whose first non-blank line is the value.
# Preferred over capture.secret below: a file's permissions decide who can read it.
#
# capture.secretFile = /etc/jahia/crh-capture.secret

# The secret given directly. Simpler, but readable by anyone who can read this file, and it ends
# up in configuration backups.
#
# capture.secret =

# ---------------------------------------------------------------------------------------------
# Capture endpoint
# ---------------------------------------------------------------------------------------------
#
# Where capture addresses THIS NODE. Normally nothing to set: the port is read from the
# container's own HTTP connector MBean, so a non-default port needs no configuration and cannot
# drift out of sync.
#
# Set it when that detection is not enough:
#
#   - the container's HTTP connector is not reachable on loopback
#   - the connector MBeans cannot be read
#   - the node serves plain HTTP nowhere, and capture has to use https
#
# It must be THIS NODE'S OWN connector, never the site's public address. Capture asks for
# /cms/render/... paths, and a public host rewrites or refuses those (SEO URL rewriting, a reverse
# proxy). The symptom is a flat HTTP 404 on every page whatever its type, versions, or the rights
# of the capture principal, reported as FAILED. A non-loopback value is accepted -- an exotic setup
# may genuinely need one -- but it is logged as a warning.
#
# Changes apply to the next capture. No restart.
#
# capture.baseUrl = http://127.0.0.1:8080
