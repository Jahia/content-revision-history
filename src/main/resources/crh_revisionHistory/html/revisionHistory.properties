# The diff panel is driven by the ?crhDiff= query parameter, and Jahia keys HTML cache
# entries on node + template type + user + locale -- NOT on the query string. A cached
# fragment would therefore be served with whichever comparison happened to be rendered first,
# to every other visitor and for every other entry. Rendering the list is a walk over a
# handful of nodes, so opting out costs little and removes the whole class of problem.
cache.expiration=0
